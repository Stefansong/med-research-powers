# AI Medical Study: Metrics and Reporting Map
# Loaded by references/modules/ai-ml.md (Core Design Element 3 + Reporting Standards).
# Standard names below match the reporting-standards index
# (${CLAUDE_PLUGIN_ROOT}/skills/reporting-standards/references/checklists/standards-index.yaml), which gives the
# reference for each. Two names are NOT in the index and carry their source inline instead: QUADAS-C (bias tool)
# and ISO 14155 (a device GCP standard, not a reporting guideline). Entries marked "no local checklist" have no
# item-by-item file there and must be checked manually against the official checklist.

## Performance Metrics by Task Type

classification:
  primary:
    - {metric: AUROC, description: "Area under ROC curve + 95% CI", when: "Always for binary/multiclass"}
    - {metric: AUPRC, description: "Area under Precision-Recall curve", when: "Class imbalance (prevalence <20%)"}
    - {metric: Sensitivity, description: "True positive rate / Recall", when: "Always"}
    - {metric: Specificity, description: "True negative rate", when: "Always"}
  secondary:
    - {metric: F1 Score, description: "Harmonic mean of precision and recall", when: "Class imbalance"}
    - {metric: Accuracy, description: "Overall correct rate", when: "Only if classes balanced; MISLEADING with imbalance"}
    - {metric: PPV/NPV, description: "Positive/Negative predictive value", when: "Clinical utility assessment"}
    - {metric: Confusion Matrix, description: "Full error breakdown", when: "Always include"}

detection_segmentation:
  primary:
    - {metric: "Dice + a boundary metric (HD95 or NSD)", description: "One overlap metric plus one boundary metric; IoU = Dice/(2-Dice), so report one of the two, not both as separate evidence (Metrics Reloaded, doi:10.1038/s41592-023-02151-z)", when: "Segmentation tasks"}
    - {metric: mAP, description: "Mean Average Precision", when: "Object detection"}
  secondary:
    - {metric: "Sensitivity @ FP rate", description: "Detection sensitivity at fixed false positive rate", when: "Lesion detection"}
    - {metric: Hausdorff Distance, description: "Max boundary error", when: "Contour accuracy matters"}

llm_vlm_evaluation:
  primary:
    - {metric: Accuracy, description: "Per-task-type accuracy (stratified)", when: "Always, stratified by question type"}
    - {metric: Human Expert Baseline, description: "Same tasks by human experts", when: "Always include comparison"}
    - {metric: Inter-rater Agreement, description: "Kappa/ICC between evaluators", when: "Subjective grading tasks"}
  secondary:
    - {metric: Failure Mode Analysis, description: "Qualitative categorization of errors", when: "Always"}
    - {metric: Calibration, description: "Confidence vs actual accuracy", when: "If model outputs confidence"}
    - {metric: Prompt Sensitivity, description: "Performance variation across prompt variants / repeated runs", when: "Always for LLM/VLM benchmarks"}

# Continuous-outcome regression (e.g., predicting a lab value, volume, age)
regression:
  primary:
    - {metric: MAE / RMSE, description: "Mean Absolute Error / Root Mean Square Error", when: "Always"}
    - {metric: "R²", description: "Coefficient of determination", when: "Always"}
  secondary:
    - {metric: Bland-Altman, description: "Agreement between predicted and reference values (bias + limits of agreement)", when: "Method-comparison framing (AI vs reference measurement)"}
    - {metric: Residual Plot, description: "Error vs predicted value", when: "Check heteroscedasticity / systematic bias"}

# Binary / time-to-event risk prediction (clinical prediction models, TRIPOD+AI scope)
risk_prediction:
  primary:
    - {metric: AUROC / C-index, description: "Discrimination + 95% CI", when: "Always"}
    - {metric: Calibration Curve, description: "Predicted vs observed probability (slope, intercept)", when: "Always — high AUROC with poor calibration is unusable"}
    - {metric: Brier Score, description: "Overall accuracy of probabilistic predictions", when: "Always"}
  secondary:
    - {metric: DCA, description: "Decision Curve Analysis — clinical net benefit across thresholds", when: "MANDATORY for clinical prediction models"}
    - {metric: NRI / IDI, description: "Reclassification / discrimination improvement vs existing model — not proper performance measures (a miscalibrated model can look better)", when: "Only if a journal asks, when comparing to an established model; report next to DCA / net benefit and the change in calibration and AUROC, never alone"}

fairness_and_bias:
  metrics:
    - {metric: Calibration by Subgroup, description: "Calibration intercept, slope and curve stratified by sex/age/race/centre — predicted risk should mean the same in every group", when: "Always for clinical deployment (preferred fairness criterion for risk models)"}
    - {metric: Error-rate parity (Equalized Odds), description: "Sensitivity (TPR) and false-positive rate (FPR) by group at the prespecified threshold, with CIs", when: "Always when a threshold is used for decisions"}
    - {metric: Subgroup AUROC, description: "AUROC stratified by demographic groups", when: "Always — aggregate AUROC hides disparities"}
    - {metric: Demographic Parity, description: "Equal positive prediction rate across groups", when: "Not a target for clinical models: when disease prevalence truly differs between groups, a well-calibrated, accurate model SHOULD flag more people in the higher-prevalence group; forcing equal positive rates miscalibrates the model and adds missed cases or false alarms. Report positive rates only descriptively next to group prevalence"}
  reporting:
    - "Report performance stratified by sex, age, race/ethnicity at minimum"
    - "Report dataset composition vs target population demographics"
    - "Disclose any demographic groups absent from training/test data"
    - "If model deployed across sites, report cross-site performance variation"

robustness:
  metrics:
    - {metric: Cross-site Generalization, description: "Performance on external hospital data", when: "Always for clinical deployment"}
    - {metric: Temporal Validation, description: "Performance on data from a later time period", when: "When data drift is possible"}
    - {metric: Domain Shift Analysis, description: "Performance under distribution shift (scanner, protocol, population)", when: "Multi-site or multi-device studies"}
    - {metric: Uncertainty Quantification, description: "Epistemic vs aleatoric uncertainty estimation", when: "Safety-critical applications"}
  reporting:
    - "Report model behavior on out-of-distribution inputs"
    - "Report failure mode taxonomy (what kinds of errors, not just error rate)"
    - "If applicable, report adversarial robustness"

calibration_extended:
  metrics:
    - {metric: "Calibration intercept + slope", description: "Primary: calibration-in-the-large (logit(p) as offset) and calibration slope, with CIs", when: "Any model outputting probabilities"}
    - {metric: Flexible Calibration Curve, description: "Smoothed (loess / spline) predicted vs observed plot with CI", when: "Always include as figure"}
    - {metric: ECE, description: "Expected Calibration Error — secondary; depends on the binning (report the bins)", when: "Optional, alongside the primary measures"}
    - {metric: MCE, description: "Maximum Calibration Error — secondary; unstable with few cases per bin", when: "Optional, safety-critical settings"}
  note: "A model can have high AUROC but terrible calibration — both must be assessed"

## Study Type → Reporting Standard Map

mapping:
  - {study: "AI-assisted diagnosis (diagnostic accuracy)", primary: "STARD-AI 2025 (index id stard-ai; Sounderajah V et al. Nat Med 2025;31(10):3283-3289, doi:10.1038/s41591-025-03953-8) — the STARD 2015 items plus 18 new or modified AI items; check the unchanged STARD 2015 rows with stard-2015.yaml; the modified items replace the STARD 2015 wording, so check every row against the official STARD-AI checklist (no local checklist for the 18 new or modified items)", supplement: "CLAIM 2024 if the AI reads medical images; MI-CLAIM; QUADAS-2 for bias (QUADAS-C for comparative accuracy, e.g. AI vs clinicians — not in the index: Yang B et al. Ann Intern Med 2021;174(11):1592-1599, doi:10.7326/M21-2234)"}
  - {study: "AI clinical trial (RCT)", primary: "CONSORT 2025 + CONSORT-AI 2020", supplement: "SPIRIT 2025 + SPIRIT-AI 2020 for the protocol"}
  - {study: "AI decision support early evaluation", primary: "DECIDE-AI 2022", supplement: "CONSORT-AI if progressing to RCT"}
  - {study: "Prediction model development / validation", primary: "TRIPOD+AI 2024", supplement: "PROBAST+AI 2025 (updates PROBAST 2019) for bias; TRIPOD-Cluster (BMJ 2023) if clustered data"}
  - {study: "LLM/VLM medical evaluation", primary: "TRIPOD-LLM (Nat Med 2025)", supplement: "CHART 2025 (index id chart) when the study evaluates a chatbot giving health advice or summarising clinical evidence; journal-specific; report prompt standardization section"}
  - {study: "Surgical video AI", primary: "STARD-AI 2025 (index id stard-ai) when the video model is an index test judged against a reference standard (diagnostic-accuracy framing); otherwise the row for the design — TRIPOD+AI 2024 for prediction, DECIDE-AI 2022 for early clinical evaluation of decision support, CONSORT 2025 + CONSORT-AI 2020 for an RCT", supplement: "CLAIM 2024 for the imaging-AI items (the index has no surgical-video-specific reporting guideline)"}
  - {study: "Medical device/instrument innovation", primary: "IDEAL Reporting Guidelines 2021 (index id ideal-reporting; Bilbro NA et al. Ann Surg 2021;273(1):82-85, doi:10.1097/SLA.0000000000004180) — stage-specific checklists for Stages 1, 2a, 2b and 4, no local checklist; first determine the stage with the IDEAL framework (index id ideal — staging only, not a reporting checklist); a Stage 3 study uses the guideline for its design (e.g. CONSORT 2025 for an RCT)", supplement: "IDEAL-D stage 0 for preclinical device work (see the ideal index entry); ISO 14155 is the good-clinical-practice standard for clinical investigations of medical devices, not a reporting guideline and not in the index (cite the current edition from iso.org; edition not verified here)"}
  - {study: "AI systematic review", primary: "PRISMA 2020 + PRISMA-S (PRISMA-DTA for diagnostic accuracy reviews)", supplement: "QUADAS-2 / PROBAST+AI / ROBINS-I for bias"}
  - {study: "Medical imaging AI", primary: "CLAIM 2024 (44 items)", supplement: "MI-CLAIM; CLAIM 2020 is superseded — do not cite as current"}
