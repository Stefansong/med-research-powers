# SPIRIT-AI extension — 15 items, transcribed verbatim from Table 1 ("SPIRIT-AI checklist") of the statement
# Source: Cruz Rivera S, Liu X, Chan A-W, Denniston AK, Calvert MJ; SPIRIT-AI and CONSORT-AI Working Group.
#         Guidelines for clinical trial protocols for interventions involving artificial intelligence:
#         the SPIRIT-AI extension. BMJ 2020;370:m3210. doi:10.1136/bmj.m3210 (PMID 32907797, PMC7490785)
#         Simultaneously published in Nat Med 2020;26(9):1351-1363 (doi:10.1038/s41591-020-1037-7, PMC7598944)
#         and Lancet Digit Health 2020;2(10):e549-e560 (doi:10.1016/S2589-7500(20)30219-3, PMC8212701).
#         Retrieved via PubMed/PMC full text; transcribed 2026-09-21.
# The statement: "The SPIRIT-AI Extension recommends that, in conjunction with existing SPIRIT 2013 items, 15 items
# (12 extensions and 3 elaborations) should be addressed for trial protocols of AI-interventions". Table footnote:
# "It is strongly recommended that this checklist be read in conjunction with the SPIRIT 2013 Explanation and
# Elaboration for important clarification on the items."
# Each SPIRIT-AI item is numbered after the SPIRIT 2013 item it extends/elaborates (eg "SPIRIT-AI 11a (iii)"),
# so every row here is its own numbered item: total_items == total_rows == 15.
# The published extension is anchored to SPIRIT 2013; MRP's base checklist is SPIRIT 2025. The `spirit_2025_item`
# field is MRP's own crosswalk (NOT part of the SPIRIT-AI publication) to the SPIRIT 2025 item covering the same
# topic — use it to place the AI item next to the right base item.
#
# Field meanings:
#   id               — SPIRIT-AI item label exactly as in Table 1 (without the "SPIRIT-AI" prefix)
#   type             — "extension" (new AI-specific content) | "elaboration" (AI-specific clarification of an existing item)
#   spirit_2013_item — SPIRIT 2013 item the AI item is attached to, as printed in Table 1
#   spirit_2025_item — MRP crosswalk to spirit-2025.yaml (see note above)
#   text             — SPIRIT-AI item text (verbatim)
#   critical         — MRP Gate 1 rule: a ❌ on a critical item blocks the protocol from being called complete;
#                      other ❌ items are reported but do not block on their own

name: SPIRIT-AI
version: "2020"
total_items: 15          # 12 extensions + 3 elaborations, each separately numbered
total_rows: 15
use_with: ["SPIRIT 2025 (spirit-2025.yaml) — SPIRIT-AI is an extension, not a stand-alone checklist; SPIRIT 2025 says to keep using the existing extensions until they are realigned", "CONSORT-AI 2020 for the eventual trial report (consort-ai.yaml)"]
reference: "Cruz Rivera et al. BMJ 2020;370:m3210 (doi:10.1136/bmj.m3210); Nat Med 2020;26:1351-1363 (doi:10.1038/s41591-020-1037-7); Lancet Digit Health 2020;2:e549-e560 (doi:10.1016/S2589-7500(20)30219-3)"
website: "https://www.equator-network.org/reporting-guidelines/spirit-artificial-intelligence/"
applies_to: "Protocols of randomised trials in which the intervention includes an artificial intelligence / machine learning component"
stage: "Protocol only — not used for the pre-submission check of a results paper (use CONSORT-AI there)"

sections:
  - name: Administrative information
    items:
      - {id: "1 (i)", type: elaboration, spirit_2013_item: "1", spirit_2025_item: "1a, 1b", topic: "Title", text: "Indicate that the intervention involves artificial intelligence/machine learning and specify the type of model.", critical: true}
      - {id: "1 (ii)", type: elaboration, spirit_2013_item: "1", spirit_2025_item: "1a, 1b", topic: "Title", text: "Specify the intended use of the AI intervention."}

  - name: Introduction
    items:
      - {id: "6a (i)", type: extension, spirit_2013_item: "6a", spirit_2025_item: "9a", topic: "Background and rationale", text: "Explain the intended use of the AI intervention in the context of the clinical pathway, including its purpose and its intended users (e.g. healthcare professionals, patients, public).", critical: true}
      - {id: "6a (ii)", type: extension, spirit_2013_item: "6a", spirit_2025_item: "9a", topic: "Background and rationale", text: "Describe any pre-existing evidence for the AI intervention."}

  - name: "Methods: Participants, interventions, and outcomes"
    items:
      - {id: "9", type: extension, spirit_2013_item: "9", spirit_2025_item: "13", topic: "Study setting", text: "Describe the onsite and offsite requirements needed to integrate the AI intervention into the trial setting."}
      - {id: "10 (i)", type: elaboration, spirit_2013_item: "10", spirit_2025_item: "14a", topic: "Eligibility criteria", text: "State the inclusion and exclusion criteria at the level of participants."}
      - {id: "10 (ii)", type: extension, spirit_2013_item: "10", spirit_2025_item: "14a", topic: "Eligibility criteria", text: "State the inclusion and exclusion criteria at the level of the input data.", critical: true}
      - {id: "11a (i)", type: extension, spirit_2013_item: "11a", spirit_2025_item: "15a", topic: "Interventions", text: "State which version of the AI algorithm will be used.", critical: true}
      - {id: "11a (ii)", type: extension, spirit_2013_item: "11a", spirit_2025_item: "15a", topic: "Interventions", text: "Specify the procedure for acquiring and selecting the input data for the AI intervention.", critical: true}
      - {id: "11a (iii)", type: extension, spirit_2013_item: "11a", spirit_2025_item: "15a", topic: "Interventions", text: "Specify the procedure for assessing and handling poor quality or unavailable input data.", critical: true}
      - {id: "11a (iv)", type: extension, spirit_2013_item: "11a", spirit_2025_item: "15a", topic: "Interventions", text: "Specify whether there is human-AI interaction in the handling of the input data, and what level of expertise is required for users."}
      - {id: "11a (v)", type: extension, spirit_2013_item: "11a", spirit_2025_item: "15a", topic: "Interventions", text: "Specify the output of the AI intervention.", critical: true}
      - {id: "11a (vi)", type: extension, spirit_2013_item: "11a", spirit_2025_item: "15a", topic: "Interventions", text: "Explain the procedure for how the AI intervention's output will contribute to decision-making or other elements of clinical practice.", critical: true}

  - name: "Methods: Monitoring"
    items:
      - {id: "22", type: extension, spirit_2013_item: "22", spirit_2025_item: "17 (and 27a)", topic: "Harms", text: "Specify any plans to identify and analyse performance errors. If there are no plans for this, justify why not.", critical: true}

  - name: Ethics and dissemination
    items:
      - {id: "29", type: extension, spirit_2013_item: "29", spirit_2025_item: "6 (data/code sharing); 2013 item 29 itself was merged into 26", topic: "Access to data", text: "State whether and how the AI intervention and/or its code can be accessed, including any restrictions to access or re-use."}

commonly_missed:
  - "Item 1 (i) / (ii) — the protocol title/abstract must say the intervention involves AI/ML, name the type of model, and state its intended use"
  - "Item 6a (ii) — pre-existing evidence for the AI intervention (development and validation studies), not just the clinical rationale"
  - "Item 9 — onsite/offsite requirements (hardware, software, vendor devices, cloud, local fine-tuning) to integrate the AI at each site"
  - "Item 10 (ii) — eligibility criteria at the level of the input data, separate from participant-level criteria"
  - "Item 11a (i) — which algorithm version will be used, and what happens if the version changes during the trial"
  - "Item 11a (iii) — pre-specified procedure for poor-quality or unavailable input data and its effect on the care pathway"
  - "Item 11a (iv) — human-AI interaction and the expertise required of users"
  - "Item 11a (vi) — the procedure by which the AI output will feed into clinical decision-making"
  - "Item 22 — a plan to identify and analyse performance errors, or an explicit justification for not having one"
  - "Item 29 — whether and how the AI intervention and/or its code can be accessed, with any restrictions"
