# RECORD checklist — transcribed verbatim from Table 1 of the RECORD statement
# Source: Benchimol EI, Smeeth L, Guttmann A, Harron K, Moher D, Petersen I, Sørensen HT, von Elm E,
#         Langan SM; RECORD Working Committee. The REporting of studies Conducted using Observational
#         Routinely-collected health Data (RECORD) statement. PLoS Med 2015;12(10):e1001885.
#         doi:10.1371/journal.pmed.1001885 (PMID 26440803; PMC4595218). Retrieved via PubMed/PMC full
#         text on 2026-09-21.
# Table 1 title: "The RECORD statement: Checklist of items, extended from the STROBE statement, that
# should be reported in observational studies using routinely collected health data."
# The statement: "RECORD consists of a checklist of 13 items related to the title, abstract,
# introduction, methods, results, and discussion section of articles, and other information required
# for inclusion in such research reports." RECORD is an EXTENSION of STROBE: "Since RECORD is an
# extension to available STROBE items, statements are presented next to corresponding STROBE checklist
# items". Complete the 22 STROBE items (strobe.yaml) first, then these 13 RECORD items.
# RECORD item numbers follow the STROBE item they extend (1.x, 6.x, 7.x, 12.x, 13.x, 19.x, 22.x). Three
# topics (data access and cleaning methods; linkage; accessibility of protocol, raw data and code) have
# no STROBE counterpart — Table 1 prints "N/A" in the STROBE item-number column for them; they are
# numbered after the nearest STROBE item (12, 22).
#
# Field meanings:
#   id           — RECORD item number exactly as in Table 1 (e.g. "6.1")
#   strobe_item  — the STROBE item (number and heading) the RECORD item extends; "N/A" as printed in
#                  Table 1 when the topic has no STROBE counterpart
#   text         — checklist item description (verbatim)
#   critical     — MRP Gate 1 rule: a ❌ on a critical item blocks submission; other ❌ items are
#                  reported but do not block on their own

name: RECORD
version: "2015"
total_items: 13          # RECORD items 1.1-22.1 (each x.y is one item; no further sub-items)
total_rows: 13
reference: "Benchimol et al. PLoS Med 2015;12(10):e1001885 (doi:10.1371/journal.pmed.1001885)"
website: "https://www.record-statement.org/"
extends: "STROBE 2007 (strobe.yaml) — RECORD items supplement, not replace, the 22 STROBE items"
applies_to: "Observational studies using routinely collected health data (administrative/claims data, electronic health records, registries, primary care databases), including linked databases"
related_extension: "RECORD-PE (2018) for pharmacoepidemiological studies using routinely collected data — Langan et al. BMJ 2018;363:k3532"
flow_diagram: "Recommended — RECORD 6.3 (linkage process, numbers with linked data at each stage) and 13.1 (study population selection incl. data-quality/availability/linkage filtering) can be shown in the study flow diagram"

sections:
  - name: Title and abstract
    items:
      - {id: "1.1", strobe_item: "1 — Title and abstract", topic: "Title and abstract", text: "The type of data used should be specified in the title or abstract. When possible, the name of the databases used should be included.", critical: true}
      - {id: "1.2", strobe_item: "1 — Title and abstract", topic: "Title and abstract", text: "If applicable, the geographic region and time frame within which the study took place should be reported in the title or abstract."}
      - {id: "1.3", strobe_item: "1 — Title and abstract", topic: "Title and abstract", text: "If linkage between databases was conducted for the study, this should be clearly stated in the title or abstract."}

  - name: Methods
    items:
      - {id: "6.1", strobe_item: "6 — Participants", topic: "Participants", text: "The methods of study population selection (such as codes or algorithms used to identify subjects) should be listed in detail. If this is not possible, an explanation should be provided.", critical: true}
      - {id: "6.2", strobe_item: "6 — Participants", topic: "Participants", text: "Any validation studies of the codes or algorithms used to select the population should be referenced. If validation was conducted for this study and not published elsewhere, detailed methods and results should be provided."}
      - {id: "6.3", strobe_item: "6 — Participants", topic: "Participants", text: "If the study involved linkage of databases, consider use of a flow diagram or other graphical display to demonstrate the data linkage process, including the number of individuals with linked data at each stage."}
      - {id: "7.1", strobe_item: "7 — Variables", topic: "Variables", text: "A complete list of codes and algorithms used to classify exposures, outcomes, confounders, and effect modifiers should be provided. If these cannot be reported, an explanation should be provided.", critical: true}
      - {id: "12.1", strobe_item: "N/A (placed after STROBE 12 — Statistical methods)", topic: "Data access and cleaning methods", text: "Authors should describe the extent to which the investigators had access to the database population used to create the study population."}
      - {id: "12.2", strobe_item: "N/A (placed after STROBE 12 — Statistical methods)", topic: "Data access and cleaning methods", text: "Authors should provide information on the data cleaning methods used in the study."}
      - {id: "12.3", strobe_item: "N/A (placed after STROBE 12 — Statistical methods)", topic: "Linkage", text: "State whether the study included person-level, institutional-level, or other data linkage across two or more databases. The methods of linkage and methods of linkage quality evaluation should be provided.", critical: true}

  - name: Results
    items:
      - {id: "13.1", strobe_item: "13 — Participants", topic: "Participants", text: "Describe in detail the selection of the persons included in the study (i.e., study population selection), including filtering based on data quality, data availability, and linkage. The selection of included persons can be described in the text and/or by means of the study flow diagram.", critical: true}

  - name: Discussion
    items:
      - {id: "19.1", strobe_item: "19 — Limitations", topic: "Limitations", text: "Discuss the implications of using data that were not created or collected to answer the specific research question(s). Include discussion of misclassification bias, unmeasured confounding, missing data, and changing eligibility over time, as they pertain to the study being reported.", critical: true}

  - name: Other information
    items:
      - {id: "22.1", strobe_item: "N/A (placed after STROBE 22 — Funding)", topic: "Accessibility of protocol, raw data, and programming code", text: "Authors should provide information on how to access any supplemental information such as the study protocol, raw data, or programming code."}

commonly_missed:
  - "Item 1.1 — name the database(s) and the type of data (e.g. 'claims data', 'primary care EHR') in the title or abstract, not only in Methods"
  - "Item 1.3 — say in the title/abstract that databases were linked"
  - "Item 6.1 / 7.1 — the actual code lists and algorithms (ICD/Read/ATC codes etc.) for population selection AND for every exposure, outcome, confounder and effect modifier, usually as a supplement; if they cannot be shared, say why"
  - "Item 6.2 — cite (or report) validation studies of the codes/algorithms — positive predictive value, sensitivity"
  - "Item 12.1 — whether investigators had access to the full database population or only an extract"
  - "Item 12.3 — linkage level (person vs institution), linkage method (deterministic/probabilistic) and how linkage quality was evaluated"
  - "Item 13.1 — how many records were dropped for data quality, data availability or failed linkage (flow diagram)"
  - "Item 19.1 — limitations specific to data not collected for research: misclassification, unmeasured confounding, missing data, changing eligibility over time"
  - "Item 22.1 — where the protocol, raw data (or access procedure) and programming code can be obtained"
