# Reporting Standards Master Index (54 standards)
# Load this file to find the right standard for a study type.
# Entries with a `file:` field have an item-by-item checklist YAML in this directory
# (21 of 54: consort-2025, consort-ai, spirit-2025, spirit-ai, tidier, trend, record, strobe, prisma-2020, prisma-scr,
#  stard-2015, tripod-2015, tripod-ai, claim-2024, decide-ai, arrive-2, cherries, cross-2021, care-2013, squire-2, cheers-2022)
# — check those item by item (their source citation is the `reference` inside the checklist file).
# Every entry WITHOUT a `file:` carries a `reference` (journal citations checked against PubMed, web-only
# sources against the official site, 2026-10-24). For those entries give that reference + the EQUATOR Network
# link and ask the user to verify against the official checklist by hand; do not invent item text.
# `items` counts for entries without a local file are index metadata only — verify before quoting.
# `type:` marks the entries that are NOT reporting guidelines (no `type:` = reporting guideline):
#   bias_tool      — risk-of-bias / quality tools used to appraise included studies (RoB 2, ROBINS-I, ROBINS-E,
#                    NOS, MINORS, QUADAS-2, PROBAST, PROBAST+AI)
#   appraisal_tool — critical-appraisal tools for reviews or guidelines (AMSTAR 2, AGREE II)
#   framework      — study-staging or evidence-grading frameworks (IDEAL, GRADE)
# They stay in the index (and in the count of 54) because users look them up here, but they are not
# checklists for reporting one's own manuscript: never use them for the pre-submission reporting check.
# `use_with` lists only other reporting guidelines that are checked together with the entry; bias tools and
# frameworks that go with a guideline are named in its `note`.

standards:
  # === Clinical Trials ===
  - id: consort-2025
    name: CONSORT 2025
    file: consort-2025.yaml
    items: 30   # 30 numbered items
    rows: 42    # including sub-items (1a/1b, 5a/5b, 12a/12b, 16a/16b, 17a/17b, 20a/20b, 21a-d, 22a/22b, 23a/23b, 24a/24b)
    for: "Randomised controlled trials"
    supersedes: "CONSORT 2010 — do NOT use old version"
    reference: "Hopewell et al. BMJ 2025;389:e081123 (doi:10.1136/bmj-2024-081123)"

  - id: consort-ai
    name: CONSORT-AI 2020
    file: consort-ai.yaml
    items: 14 extension items
    for: "RCTs of AI interventions"
    use_with: consort-2025

  - id: consort-noninferiority
    name: CONSORT extension for non-inferiority and equivalence trials 2012
    for: "Non-inferiority and equivalence randomised trials"
    use_with: consort-2025
    reference: "Piaggio G et al. JAMA 2012;308(24):2594-2604 (doi:10.1001/jama.2012.87802)"
    note: "Report both ITT and per-protocol analyses; state the non-inferiority margin and its justification"

  - id: spirit-2025
    name: SPIRIT 2025
    file: spirit-2025.yaml
    items: 34
    for: "RCT protocols"
    supersedes: "SPIRIT 2013"
    note: "Protocol stage only — not used for the pre-submission check of a results paper"

  - id: spirit-ai
    name: SPIRIT-AI 2020
    file: spirit-ai.yaml
    for: "AI intervention RCT protocols"
    use_with: spirit-2025

  - id: tidier
    name: TIDieR 2014
    file: tidier.yaml
    items: 12
    for: "Intervention description and replication"
    note: "Partially integrated into CONSORT 2025 but standalone useful"

  - id: consort-harms
    name: CONSORT-Harms 2022
    for: "Harms reporting in RCTs"
    reference: "Junqueira DR et al. BMJ 2023;381:e073725 (doi:10.1136/bmj-2022-073725)"
    note: "Partially integrated into CONSORT 2025 (harms items 7, 15, 21a, 23a, 27)"

  # === Non-randomised interventions ===
  - id: trend
    name: TREND 2004
    file: trend.yaml
    items: 22
    for: "Non-randomised evaluations of behavioural / public health interventions"
    reference: "Des Jarlais DC et al. Am J Public Health 2004;94(3):361-366 (doi:10.2105/ajph.94.3.361)"

  # === Observational ===
  - id: strobe
    name: STROBE 2007
    file: strobe.yaml
    items: 22
    rows: 34    # including sub-items (1a/1b, 6a/6b, 12a-e, 13a-c, 14a-c, 16a-c)
    for: "Cohort, case-control, cross-sectional studies"
    reference: "von Elm et al. PLoS Med 2007;4(10):e296 (doi:10.1371/journal.pmed.0040296)"

  - id: record
    name: RECORD 2015
    file: record.yaml
    items: 13
    for: "Studies using routinely collected health data (EMR, administrative)"
    use_with: strobe

  - id: target
    name: TARGET 2025
    items: 21
    for: "Observational studies that explicitly emulate a target trial to estimate the causal effect of an intervention"
    reference: "Cashin AG et al. BMJ 2025;390:e087179 (doi:10.1136/bmj-2025-087179); simultaneously JAMA 2025;334(12):1084-1093 (doi:10.1001/jama.2025.13350)"
    note: "Transparent Reporting of Observational Studies Emulating a Target Trial: 21-item checklist in six sections (abstract, introduction, methods, results, discussion, other information)"

  - id: strocss
    name: STROCSS 2024
    items: "13 (44 rows incl. sub-items)"
    for: "Surgical cohort/cross-sectional/case-control studies"
    supersedes: "STROCSS 2021"
    reference: "Rashid R et al. Int J Surg 2024;110(6):3151-3165 (doi:10.1097/JS9.0000000000001268)"
    note: "A 2025 update adding an 'Artificial Intelligence' section (Agha RA et al., Premier Journal of Science 2025; reported as 6 new AI items) exists but its full text, item count and DOI were not verified here (待核实) — if the study used AI, check the current checklist on the official STROCSS website"

  # === Systematic Reviews ===
  - id: prisma-2020
    name: PRISMA 2020
    file: prisma-2020.yaml
    items: 27
    rows: 42    # including sub-items (10a/10b, 13a-f, 16a/16b, 20a-d, 23a-d, 24a-c)
    for: "Systematic reviews and meta-analyses"
    supersedes: "PRISMA 2009"
    reference: "Page et al. BMJ 2021;372:n71 (doi:10.1136/bmj.n71)"

  - id: prisma-p
    name: PRISMA-P 2015
    items: 17
    for: "Systematic review protocols (PROSPERO registration)"
    reference: "Moher D et al. Syst Rev 2015;4(1):1 (doi:10.1186/2046-4053-4-1); Explanation & Elaboration: Shamseer L et al. BMJ 2015;350:g7647 (doi:10.1136/bmj.g7647)"
    note: "Protocol stage only — not used for the pre-submission check of a completed review"

  - id: prisma-scr
    name: PRISMA-ScR 2018
    file: prisma-scr.yaml
    items: 22
    for: "Scoping reviews"

  - id: prisma-s
    name: PRISMA-S 2021
    items: 16
    for: "Search reporting in systematic reviews"
    use_with: prisma-2020
    reference: "Rethlefsen ML et al. Syst Rev 2021;10(1):39 (doi:10.1186/s13643-020-01542-z)"

  - id: prisma-dta
    name: PRISMA-DTA 2018
    items: 27
    for: "Diagnostic test accuracy systematic reviews"
    reference: "McInnes MDF et al. JAMA 2018;319(4):388-396 (doi:10.1001/jama.2017.19163)"
    note: "Stand-alone 27-item extension built on the original PRISMA statement — use it in place of the PRISMA checklist for DTA reviews. Appraise the included studies with QUADAS-2 (quadas-2 is a bias tool, not a reporting checklist)"

  - id: tripod-srma
    name: TRIPOD-SRMA 2023 (BMJ)
    for: "Systematic reviews of prediction models"
    reference: "Snell KIE et al. BMJ 2023;381:e073538 (doi:10.1136/bmj-2022-073538)"

  - id: amstar-2
    name: AMSTAR 2 (2017)
    type: appraisal_tool
    items: 16
    for: "Critical appraisal of systematic reviews"
    reference: "Shea BJ et al. BMJ 2017;358:j4008 (doi:10.1136/bmj.j4008)"

  - id: grade
    name: GRADE framework
    type: framework
    for: "Rating the certainty (quality) of a body of evidence for each outcome, and the strength of recommendations"
    reference: "Guyatt GH et al. BMJ 2008;336(7650):924-926 (doi:10.1136/bmj.39489.470347.AD); rating up: Guyatt GH et al. J Clin Epidemiol 2011;64(12):1311-1316 (doi:10.1016/j.jclinepi.2011.06.004)"
    note: "Certainty is rated per outcome, not once per review. Five domains can lower it (risk of bias, inconsistency, indirectness, imprecision, publication bias); for observational evidence it can be rated up for a large effect, a dose-response gradient, or when all plausible confounding would reduce the apparent effect"

  # === Diagnostic ===
  - id: stard
    name: STARD 2015
    file: stard-2015.yaml
    items: 30
    rows: 34    # including sub-items (10a/10b, 12a/12b, 13a/13b, 21a/21b)
    for: "Diagnostic accuracy studies"
    supersedes: "STARD 2003"
    reference: "Bossuyt et al. BMJ 2015;351:h5527 (doi:10.1136/bmj.h5527)"

  - id: stard-ai
    name: STARD-AI 2025
    items: "STARD 2015 items + 18 new or modified AI items"
    for: "Diagnostic accuracy studies of AI index tests (AI-centred diagnostic test accuracy studies)"
    use_with: stard
    reference: "Sounderajah V et al. Nat Med 2025;31(10):3283-3289 (doi:10.1038/s41591-025-03953-8)"
    note: "Primary guideline for AI diagnostic accuracy studies. Check the STARD 2015 rows with stard-2015.yaml, but the 18 new or modified STARD-AI items have no local checklist — modified items change STARD 2015 wording, so check every row against the official STARD-AI checklist; do not invent item text"

  # === Prediction & AI ===
  - id: tripod-ai
    name: TRIPOD+AI 2024
    file: tripod-ai.yaml
    items: 27
    rows: 52    # including sub-items (3a-c, 5a/b, 6a-c, 8a-c, 9a-c, 12a-g, 18a-f, 20a-c, 23a/b, 27a-c)
    for: "Prediction model development/validation (regression or machine learning)"
    supersedes: "TRIPOD 2015"
    reference: "Collins et al. BMJ 2024;385:e078378 (doi:10.1136/bmj-2023-078378)"
  - id: tripod-2015
    name: TRIPOD 2015
    file: tripod-2015.yaml
    items: 22
    for: "Prediction model development / validation studies (regression-based); use when a journal or reviewer still asks for the 2015 checklist"
    superseded_by: "TRIPOD+AI 2024 — prefer tripod-ai for new manuscripts"
    reference: "Collins GS et al. BMJ 2015;350:g7594 (doi:10.1136/bmj.g7594)"


  - id: tripod-llm
    name: TRIPOD-LLM 2025 (Nat Med, Jan 2025)
    items: "19 main items, 50 subitems (modular: 14 main items / 32 subitems apply to every LLM study design)"
    for: "LLM/VLM medical evaluation studies"
    reference: "Gallifant J et al. Nat Med 2025;31(1):60-69 (doi:10.1038/s41591-024-03425-5)"
    note: "Extension of TRIPOD+AI for studies using large language models; for studies of chatbots answering health questions see chart"

  - id: chart
    name: CHART 2025
    items: "12 items, 39 subitems"
    for: "Chatbot health advice studies — evaluations of generative-AI chatbots summarising clinical evidence or giving health advice"
    reference: "CHART Collaborative. BMJ Med 2025;4(1):e001632 (doi:10.1136/bmjmed-2025-001632); Explanation & Elaboration: BMJ 2025;390:e083305 (doi:10.1136/bmj-2024-083305); the statement was also published in Ann Fam Med, BMC Med, Br J Surg and Artif Intell Med"
    note: "Chatbot Assessment Reporting Tool (checklist + methods flow diagram)"

  - id: tripod-cluster
    name: TRIPOD-Cluster 2023 (BMJ)
    items: 19
    for: "Prediction models with clustered data"
    use_with: tripod-ai
    reference: "Debray TPA et al. BMJ 2023;380:e071018 (doi:10.1136/bmj-2022-071018)"
    note: "Stand-alone checklist (19 main items) for models developed or validated on clustered data (multicentre / EHR data, IPD meta-analysis); not for clustering by repeated measurements within individuals"

  - id: claim
    name: CLAIM 2024
    file: claim-2024.yaml
    items: 44
    for: "AI in medical imaging"
    supersedes: "CLAIM 2020 (42 items)"
    reference: "Tejani AS et al. Radiol Artif Intell 2024;6(4):e240300 (doi:10.1148/ryai.240300)"

  - id: mi-claim
    name: MI-CLAIM 2020
    items: "6 parts; checklist = 17 check items + input data type + choice of 1 of 4 code-sharing tiers"
    for: "Minimum information about clinical AI modeling"
    reference: "Norgeot B et al. Nat Med 2020;26(9):1320-1324 (doi:10.1038/s41591-020-1041-y)"
    note: "Item count taken from the checklist file in the official MI-CLAIM GitHub repository (stated to match the published table). For generative AI see MI-CLAIM-GEN: Miao BY et al. Nat Med 2025;31(5):1394-1398 (doi:10.1038/s41591-024-03470-0)"

  - id: decide-ai
    name: DECIDE-AI 2022
    file: decide-ai.yaml
    items: "17 AI-specific + 10 generic"
    for: "Early-stage clinical evaluation of AI decision support"
    key_items:
      - "AI system description (inputs, outputs, intended users, use context)"
      - "Human-AI interaction workflow"
      - "Clinical workflow integration"
      - "Safety monitoring and adverse events"
      - "Usability and user experience data"

  - id: probast
    name: PROBAST 2019
    type: bias_tool
    items: 20
    for: "Bias risk in prediction models"
    reference: "Wolff RF et al. Ann Intern Med 2019;170(1):51-58 (doi:10.7326/M18-1376)"
    note: "PROBAST+AI 2025 (probast-ai) is available for AI models and, per its authors, may replace PROBAST 2019 for regression models too"

  - id: probast-ai
    name: PROBAST+AI 2025
    type: bias_tool
    items: "16 signalling questions (model development) + 18 (model evaluation)"
    for: "Quality, risk of bias and applicability of prediction model studies — regression or AI / machine-learning models"
    reference: "Moons KGM et al. BMJ 2025;388:e082505 (doi:10.1136/bmj-2024-082505)"
    note: "Update of PROBAST 2019; two parts (model development, model evaluation), each with four domains: participants and data sources, predictors, outcome, analysis"

  # === Surgery & Devices ===
  - id: ideal-reporting
    name: IDEAL Reporting Guidelines 2021
    for: "Reports of surgical / device innovation studies at IDEAL Stage 1, 2a, 2b or 4 (stage-specific checklists)"
    reference: "Bilbro NA et al. Ann Surg 2021;273(1):82-85 (doi:10.1097/SLA.0000000000004180)"
    note: "Determine the stage with the `ideal` framework entry first, then use that stage's checklist from the official source (no local checklist). There is no IDEAL checklist for Stage 3 (participants called for reporting guidelines for every stage except Stage 3) — report a Stage 3 study with the guideline for its design (e.g. CONSORT 2025 for an RCT)"

  - id: ideal
    name: IDEAL 2009/2013 (updated 2019)
    type: framework
    for: "Surgical/device innovation stages (staging only — the reporting checklists are ideal-reporting)"
    reference: "Hirst A et al. Ann Surg 2019;269(2):211-220 (doi:10.1097/SLA.0000000000002794) — 2019 update that added the Pre-IDEAL stage"
    stages:
      - "Pre-IDEAL / Stage 0 (Preclinical): preclinical studies before first-in-human use (added in the 2019 update; for devices see IDEAL-D stage 0: Marcus HJ et al. Ann Surg 2022;275(1):73-79, doi:10.1097/SLA.0000000000004907)"
      - "Stage 1 (Idea): First-in-human, proof of concept, case reports"
      - "Stage 2a (Development): Technical refinement, learning curve studies"
      - "Stage 2b (Exploration): Prospective cohort, feasibility studies"
      - "Stage 3 (Assessment): RCT or high-quality comparative study"
      - "Stage 4 (Long-term): Registry, long-term outcome surveillance"

  # === Surveys & Measurement ===
  - id: cherries
    name: CHERRIES 2004
    file: cherries.yaml
    for: "Web-based / internet surveys"
    reference: "Eysenbach G. J Med Internet Res 2004;6(3):e34 (doi:10.2196/jmir.6.3.e34)"
    note: "Checklist organised in 8 sections (design; IRB approval and consent; development and pre-testing; recruitment and sample; survey administration; response rates; preventing multiple entries; analysis)"

  - id: cross
    name: CROSS 2021
    file: cross-2021.yaml
    items: 40
    for: "Survey / questionnaire studies"
    reference: "Sharma A et al. J Gen Intern Med 2021;36(10):3179-3187 (doi:10.1007/s11606-021-06737-1)"
    note: "Consensus-Based Checklist for Reporting of Survey Studies; use CHERRIES in addition for web-based administration"

  - id: accord
    name: ACCORD 2024
    items: 35
    for: "Consensus methods in biomedicine (Delphi, nominal group technique, consensus meetings)"
    reference: "Gattrell WT et al. PLoS Med 2024;21(1):e1004326 (doi:10.1371/journal.pmed.1004326)"
    note: "ACcurate COnsensus Reporting Document; use for Delphi / consensus studies (CROSS is for survey studies)"

  - id: cosmin
    name: COSMIN Reporting Guideline 2.0 (2025)
    for: "Studies on measurement properties of patient-reported outcome measures"
    items: "31 general + 37 property-specific items"
    reference: "Gagnier JJ et al. Qual Life Res 2025;34(7):1901-1911 (doi:10.1007/s11136-025-03950-x); Explanation & Elaboration: Qual Life Res 2025;34(7):1891-1899 (doi:10.1007/s11136-025-03949-4)"
    supersedes: "COSMIN Reporting Guideline 2021 (version 1.0; 71 items; Gagnier JJ et al. Qual Life Res 2021;30(8):2197-2218, doi:10.1007/s11136-021-02822-4) — the authors recommend no longer using version 1.0"
    note: "Reporting guideline for PROM measurement-property studies (validity, reliability, responsiveness); the COSMIN Risk of Bias checklist is a separate tool"

  # === Qualitative ===
  - id: coreq
    name: COREQ 2007
    items: 32
    for: "Qualitative research using interviews or focus groups"
    reference: "Tong A et al. Int J Qual Health Care 2007;19(6):349-357 (doi:10.1093/intqhc/mzm042)"

  - id: srqr
    name: SRQR 2014
    items: 21
    for: "Qualitative research (alternative to COREQ)"
    reference: "O'Brien BC et al. Acad Med 2014;89(9):1245-1251 (doi:10.1097/ACM.0000000000000388)"

  # === Preclinical ===
  - id: arrive
    name: ARRIVE 2.0 (2020)
    file: arrive-2.yaml
    items: 21   # Essential 10 + Recommended Set (11)
    rows: 38    # including sub-items (1a/b, 2a/b, 3a-c, 4a/b, 6a/b, 7a/b, 8a/b, 9a-d, 10a/b, 12a/b, 16a-c, 17a/b, 21a/b)
    for: "Animal experiments"
    supersedes: "ARRIVE 2010"
    reference: "Percie du Sert et al. PLoS Biol 2020;18(7):e3000410 (doi:10.1371/journal.pbio.3000410)"

  # === Other ===
  - id: care
    name: CARE 2013 (E&E 2017)
    file: care-2013.yaml
    items: 13
    for: "Case reports"

  - id: squire
    name: SQUIRE 2.0 (2015)
    file: squire-2.yaml
    items: 18
    for: "Quality improvement studies"

  - id: cheers
    name: CHEERS 2022
    file: cheers-2022.yaml
    items: 28
    for: "Health economic evaluations"

  # === Guidelines Appraisal ===
  - id: agree-ii
    name: AGREE II (2010)
    type: appraisal_tool
    items: "23 (6 domains) + 2 overall assessment items"
    for: "Clinical practice guideline quality appraisal"
    reference: "Brouwers MC et al. CMAJ 2010;182(18):E839-E842 (doi:10.1503/cmaj.090449)"
    note: "Use for systematic reviews of clinical guidelines. The instrument dates from 2009/2010; 2017 is the date of the updated user's manual, not a new version"

  # === Meta-Analysis Extensions ===
  - id: moose
    name: MOOSE 2000
    items: 35
    for: "Meta-analyses of observational studies"
    use_with: prisma-2020
    reference: "Stroup DF et al. JAMA 2000;283(15):2008-2012 (doi:10.1001/jama.283.15.2008)"
    note: "Recommended alongside PRISMA 2020 when pooling cohort, case-control or cross-sectional studies; required only where the target journal asks for it"

  - id: prisma-nma
    name: PRISMA-NMA 2015
    items: 32
    for: "Network meta-analysis (indirect treatment comparisons)"
    use_with: prisma-2020
    reference: "Hutton B et al. Ann Intern Med 2015;162(11):777-784 (doi:10.7326/M14-2385)"

  # === Cluster Trials ===
  - id: consort-cluster
    name: CONSORT-Cluster 2012
    items: Extension items
    for: "Cluster randomized trials (community, hospital, clinic-level randomization)"
    use_with: consort-2025
    reference: "Campbell MK et al. BMJ 2012;345:e5661 (doi:10.1136/bmj.e5661)"
    note: "Use whenever groups (clusters) rather than individuals are randomised. Written for CONSORT 2010; the CONSORT 2025 statement names cluster trials among the extensions to keep using until they are realigned"

  # === Bias Assessment Tools ===
  - id: rob-2
    name: Cochrane RoB 2 (2019)
    type: bias_tool
    domains: 5
    for: "RCT bias risk"
    reference: "Sterne JAC et al. BMJ 2019;366:l4898 (doi:10.1136/bmj.l4898)"

  - id: robins-i
    name: ROBINS-I 2016
    type: bias_tool
    domains: 7
    for: "Non-randomized intervention study bias"
    reference: "Sterne JA et al. BMJ 2016;355:i4919 (doi:10.1136/bmj.i4919)"
    note: "ROBINS-I V2 is published as a draft on the official site (https://www.riskofbias.info/welcome/robins-i-v2; first released November 2024 and still labelled draft; it initially covers cohort-type follow-up studies). No peer-reviewed V2 paper was found in PubMed on 2026-10-24 — check the current version and its domain list on the official site before using it (待核实)"

  - id: robins-e
    name: ROBINS-E (2024)
    type: bias_tool
    domains: 7
    for: "Risk of bias in a result from a non-randomised (cohort-type) follow-up study of the effect of an exposure on an outcome"
    reference: "Higgins JPT et al. Environ Int 2024;186:108602 (doi:10.1016/j.envint.2024.108602)"
    note: "Currently for cohort studies; the authors state that variants for other designs (e.g. case-control studies) are future work"

  - id: nos
    name: Newcastle-Ottawa Scale
    type: bias_tool
    max_score: 9
    for: "Quality of cohort and case-control studies (star system: selection, comparability, exposure / outcome)"
    reference: "Wells GA, Shea B, et al. The Newcastle-Ottawa Scale (NOS) for assessing the quality of nonrandomised studies in meta-analyses. Ottawa Hospital Research Institute, https://www.ohri.ca/programs/clinical_epidemiology/oxford.asp (web resource, no journal publication)"
    note: "Use only with caveats: it gives a star score rather than a domain-based risk-of-bias judgement, and its validity has been questioned (Stang A. Eur J Epidemiol 2010;25(9):603-605, doi:10.1007/s10654-010-9491-z). Prefer ROBINS-I (interventions) or ROBINS-E (exposures, cohort studies); use NOS only when it is required (journal, existing protocol) or no ROBINS variant fits (e.g. case-control studies of exposures), and report the judgement for each item, not just the total"

  - id: minors
    name: MINORS 2003
    type: bias_tool
    items: 12
    for: "Non-randomized surgical studies"
    reference: "Slim K et al. ANZ J Surg 2003;73(9):712-716 (doi:10.1046/j.1445-2197.2003.02748.x)"
    note: "Items 1-8 apply to non-comparative studies, all 12 to comparative studies"

  - id: quadas-2
    name: QUADAS-2 2011
    type: bias_tool
    domains: 4
    for: "Diagnostic accuracy study bias"
    reference: "Whiting PF et al. Ann Intern Med 2011;155(8):529-536 (doi:10.7326/0003-4819-155-8-201110180-00009)"
