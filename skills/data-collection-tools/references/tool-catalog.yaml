# Data Collection Tool Catalog
# 这是【可选工具目录】，不是必须全套生成：先按 SKILL.md Step 2 分析真实数据来源，
# Step 3 列出本研究需要的工具和理由并经用户确认，然后只生成确认过的工具。
# 文件名是建议名；字段、编码、取值范围按 SAP 和真实导出样例现写，不照抄 note 里的例子。
# Lookup tables: optional tools per study type, plus a default project directory
# structure (trim it to the study). Generation LOGIC stays in SKILL.md (Step 4).
# Fixed-logic guardrail scripts shipped with the plugin (copy or call, never rewrite ad hoc):
#   ${CLAUDE_PLUGIN_ROOT}/skills/data-collection-tools/scripts/patient_level_split.py
#   ${CLAUDE_PLUGIN_ROOT}/skills/data-collection-tools/scripts/randomization.py   (run only by the allocation
#       holder, outside the project folder: its list, summary and command never go into tools/)
#   ${CLAUDE_PLUGIN_ROOT}/skills/statistical-analysis/scripts/power_analysis.py   (a priori sample size)

study_type_tools:

  ai_ml_benchmark:        # VLM/LLM evaluation
    label: "AI/ML Benchmark 研究"
    tools:
      - { tool: "Prompt 模板",  file: "tools/prompts.json",            note: "标准化 Prompt，每个任务维度一套" }
      - { tool: "推理脚本",      file: "tools/vlm_inference.py",        note: "API 调用、批量推理；推理输出写到 data/model_outputs/（它们是统计分析的输入，不放 results/）；输入含患者数据时，只有 research-ethics checklist §4「外部 AI 服务」一条的条件全部满足才发给外部模型 API（默认只发匿名化数据；脚本启动时打印这条提醒，要显式参数才发送），见 SKILL.md A 节" }
      - { tool: "标注模板",      file: "tools/annotation_template.csv", note: "专家标注 Ground Truth 用" }
      - { tool: "评分模板",      file: "tools/scoring_template.csv",    note: "开放题专家评分用" }
      - { tool: "结果汇总脚本",  file: "tools/analysis_pipeline.py",    note: "解析 data/model_outputs/ 里的推理输出、汇总成分析用的表（写到 data/processed/）；正式统计分析由 statistical-analysis 生成 analysis_script.py，结果写到 results/" }
      - { tool: "数据目录",      file: "data/ 目录结构",                note: "标准化文件组织" }

  ai_diagnostic_prediction:
    label: "AI 诊断/预测模型"
    tools:
      - { tool: "数据提取表", file: "tools/data_extraction.csv",     note: "从病历/影像系统提取变量" }
      - { tool: "标注模板",   file: "tools/annotation_template.csv", note: "Ground Truth 标注" }
      - { tool: "标注指南",   file: "tools/annotation_guide.md",     note: "标注标准、示例、争议处理" }
      - { tool: "数据划分脚本", file: "tools/data_split.py",         note: "患者级 hold-out / K 折划分：复制自 ${CLAUDE_PLUGIN_ROOT}/skills/data-collection-tools/scripts/patient_level_split.py；输出 data/splits/split_summary.json（类别分布 + 泄漏检查）" }
      - { tool: "评估脚本",   file: "tools/evaluation.py",           note: "AUROC/AUPRC/混淆矩阵/DCA；读 data/model_outputs/ 里的模型预测（输入）。它属于统计分析：由 analysis_script.py 调用或写进它，结果才写到 results/（单独运行时要在重跑核对的 --cmd 里和 analysis_script.py 串起来）——reproduce_check 只重跑 --cmd 里的命令，results/ 里别的脚本写的文件重跑前被移走、不会再生成" }

  clinical:
    label: "临床研究（RCT / 队列 / 横断面）"
    tools:
      - { tool: "病例报告表",   file: "tools/CRF.xlsx 或 tools/CRF.csv", note: "每个变量一列，含数据字典" }
      - { tool: "数据字典",     file: "tools/data_dictionary.md",        note: "变量名、类型、取值范围、编码规则" }
      - { tool: "筛选表",       file: "tools/screening_log.csv",         note: "纳入/排除标准逐条判定" }
      - { tool: "随机分配机制", file: "tools/README.md 的「随机分配」一节", note: "仅 RCT。项目里只写分配机制：招募者怎样拿到下一个分配（按序编号的不透明密封信封 / 中央电话或网络随机系统）、分配表由谁保管。分配表和 *_summary.json（seed、区组大小）不在项目文件夹里：由负责分配的人（独立统计师 / 试验办公室）用 ${CLAUDE_PLUGIN_ROOT}/skills/data-collection-tools/scripts/randomization.py 在项目文件夹以外、只有他能访问的位置生成并保管（不给 --seed 时自动取不可预测的 seed）；生成命令不写进 tools/README.md 或 CRF 指南，seed 和区组大小不写进 study-protocol.md" }
      - { tool: "样本量复核",   file: "(不单独生成)",                    note: "先验样本量已在 study-protocol.md；复核用 ${CLAUDE_PLUGIN_ROOT}/skills/statistical-analysis/scripts/power_analysis.py，禁止事后 power" }

  basic_experiment:
    label: "基础实验"
    tools:
      - { tool: "实验记录表",   file: "tools/experiment_log.xlsx",  note: "实验条件、日期、操作者、结果" }
      - { tool: "图像采集规范", file: "tools/image_acquisition.md", note: "显微镜/WB/荧光拍摄参数标准化" }
      - { tool: "数据录入模板", file: "tools/data_entry.csv",       note: "定量数据录入（OD 值、灰度值等）" }

  systematic_review_meta:
    label: "系统综述 / Meta 分析"
    tools:
      - { tool: "数据提取表",   file: "tools/sr_data_extraction.xlsx", note: "每篇纳入研究提取的变量" }
      - { tool: "偏倚评估表",   file: "tools/risk_of_bias.xlsx",       note: "RoB 2 / NOS / ROBINS-I 评估表" }
      - { tool: "PRISMA 模板",  file: "tools/prisma_template.md",      note: "PRISMA 流程图数据录入" }
      - { tool: "双人筛选记录", file: "tools/dual_screening.csv",      note: "两位筛选者的独立判定 + 不一致记录" }

# Default project directory structure (SKILL.md Step 5) — trim to what the study needs
# (e.g. no annotations/ without annotators; one annotator_N/ per actual annotator)
project_directory_structure: |
  project/
  ├── data/
  │   ├── raw/                  ← 原始数据（不修改）
  │   ├── processed/            ← 预处理后数据
  │   ├── annotations/          ← 标注结果
  │   │   ├── annotator_1/
  │   │   ├── annotator_2/
  │   │   ├── annotator_3/
  │   │   └── consensus/
  │   ├── model_outputs/        ← AI 模型推理输出 / 预测（统计分析的输入）
  │   └── splits/               ← 训练/验证/测试划分
  ├── tools/                    ← 本 skill 生成的工具（不含随机分配表）
  ├── analysis_script.py        ← 统计分析脚本（statistical-analysis 生成）
  ├── results/                  ← 只放 analysis_script.py（及它调用的脚本）写出的结果（reproduce_check 的 --outputs，重跑前会被移走）
  ├── manuscript/               ← 论文文稿
  └── .mrp-state.json           ← 项目状态
  # 随机分配表和它的 *_summary.json 不在这个目录里：负责分配的人另行保管（SKILL.md C 节）
