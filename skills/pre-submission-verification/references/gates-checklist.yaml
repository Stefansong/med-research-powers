# Pre-Submission Verification — 6-Gate Checklists
# Loaded by pre-submission-verification/SKILL.md Workflow.
# 全部通过才进入 manuscript-export → submission-preparation。任何 Gate 失败 → 列出修改项，回对应 skill。
# PubMed MCP 工具名写作 mcp__<server名>__<函数>；server 名以当前会话工具列表为准
# （claude.ai 连接器为 claude_ai_PubMed，本地常见为 PubMed）。

gate_1:
  name: 报告规范合规
  via: "调用 reporting-standards skill（读取其产物 reporting-compliance-report.md）"
  steps:
    - 确定研究类型 → 选择对应规范（standards-index.yaml；有本地 checklist 的规范逐条检查）
    - "逐条检查（✅ / ⚠️ / ❌ / N/A），每条标注论文位置"
    - 读取 reporting-compliance-report.md 的 critical ❌ 数量
  pass_criterion: "0 个 critical ❌（critical 由各 checklist YAML 的 critical: true 定义；非 critical ❌ 和 ⚠️ 记录为 Action Items，不单独阻止）"
  on_fail: "回 manuscript-writing 修改对应章节 → 重跑 reporting-standards"

gate_2:
  name: 统计完整性
  inputs: ["analysis-plan.md (SAP)", "results-summary.md", "analysis-log.md", "reproduce-check.md", "manuscript/*.md"]
  items:
    - 所有主要结局报告了效应量 + 95% CI（不只 p 值）
    - p 值报告精确值（不只 p < 0.05）
    - "多重比较按 SAP 处理：SAP 有多个主要/共同主要比较，或结论建立在多次检验之上（如多个次要结局一起下结论、多个亚组、组学）时，按 SAP 写明的方法校正（Bonferroni / Holm / FDR 等），并在 Methods 和 Results 中说明；只有一个预先指定的主要比较时不需要校正（本条标 N/A 并写原因）；未校正的次要和探索性结果明确标为次要 / 探索性，不据此下确证性结论"
    - 敏感性分析已完成并报告（缺失数据假设、异常值影响、替代分析方法）
    - 样本量计算依据已写入 Methods（先验计算，非事后）
    - 统计软件及版本已标注
    - 完整的分析脚本（Python/R）已生成，包含版本、随机种子、参数注释
    - 脚本输出数字与论文 Results 逐项核对一致
    - "重跑一致性证据：reproduce-check.md（statistical-analysis 用 reproduce_check.py --compare-stdout 生成）存在，结论为「一致」（= 退出码 0）；「屏幕输出（stdout）」一行没有「未计入结论」（即加了 --compare-stdout）；「错误输出（stderr）」一行写「未计入结论」不算问题——R 的包加载信息等启动消息常写在 stderr，只有结果写在 stderr（R 的 message()、Python 的 logging）时才须加 --compare-stderr，不要为了过 Gate 而加；报告「需要留意」一节的项（缓存、运行日期、stderr 各次不同等）已逐条处理；报告晚于分析脚本和数据的最后一次修改（脚本改过就重跑）。结论为「不一致」或「未完成」、缺报告、stdout 一行写着「未计入结论」、或报告早于最后一次修改 → ❌"
    - 与 SAP（analysis-plan.md）的任何偏差已在 Methods 中说明理由（本条只在 Gate 2 核对）
    - 探索性分析已明确标注为 "exploratory"，与预定分析区分
  pass_criterion: "以上各条均 ✅（N/A 需写原因）"
  on_fail: "回 statistical-analysis"

gate_3:
  name: Claim Verification（内容真实性验证）
  purpose: "验证论文中的每个事实断言都有数据支撑，防止 AI 幻觉和数据不一致。"
  phase_A:
    name: 参考文献真实性
    via: "调用 pubmed-search skill 的 Mode 3（Citation Verification），本 Gate 不重复其流程"
    how:
      - "有 PMID → mcp__<server名>__get_article_metadata(pmids=[...]) 核对标题/作者/年份"
      - "有 DOI 无 PMID → mcp__<server名>__convert_article_ids(ids=[...], id_type=\"doi\") 转 PMID → 同上"
      - "只有作者+年份+期刊 → mcp__<server名>__lookup_article_by_citation 反查"
      - "引用 ≥ 10 条时分批（每批 ≤ 10 条），先查支撑主要结论的引用，再查其余"
    status_codes:
      - "✅ Verified — 找到且标题/作者/年份相符"
      - "⚠️ Not found — 查询成功但无命中"
      - "❌ Mismatch — 找到但作者/年份/标题不符（报告差异）"
      - "⏳ Unverified (tool error / web search only / not checked) — 工具报错或连接失败，或只凭 WebSearch 找到 / 没有任何途径能核对（见 pubmed-search「没有 PubMed MCP 时」）；不等于文献不存在，工具报错时重试一次，仍未核对则列为待人工核对"
      - "ℹ️ Non-PubMed — 书籍、指南、arXiv 等，改用 DOI / WebSearch 核对"
    gate_rules:
      - "⚠️ Not found / ❌ Mismatch 的引用：作者提供原文 PDF 或 DOI 页面证明存在并修正，否则删除"
      - "⏳ Unverified 的引用不能计为通过，也不能删除；Gate 3 不因工具故障判为通过"
      - "支撑主要结论的关键引用（≤ 10 篇）：有 PMCID 时用 mcp__<server名>__get_full_text_article 核对结论，否则核对摘要"
    pass_criterion: "0 条 ⚠️ / ❌ 未处理；0 条 ⏳ 未人工核对"
  phase_B:
    name: 数据一致性
    items:
      - Abstract 中的数字与 Results 一致
      - 正文中的数字与 Tables/Figures 一致
      - Results 中的数字与 results-summary.md 一致
      - 同一数据在不同位置引用时数值相同
  phase_C:
    name: Claims-Evidence 对应
    items:
      - 每个 "我们发现..."/"结果表明..." 断言都有对应的统计结果
      - Conclusion 中的每个结论都有 Results 支撑
      - 没有过度推断（如观察性研究推因果）
  phase_D:
    name: 方法-结果匹配
    items:
      - Methods 中描述的每个分析在 Results 中都有结果
      - Results 中没有 Methods 未描述的分析（后加的需标注）
      - SAP 中预定的分析都在 Results 中出现（偏差的说明在 Gate 2 核对，此处不重复）
  phase_E:
    name: 预定 vs 探索性分析区分
    items:
      - Methods 明确区分"预定分析"和"探索性分析"
      - 每个探索性结论标注为 "exploratory"
      - 未预先计划的"显著"结果未作为主要结论呈现
  phase_F:
    name: AI 生成内容标记
    items:
      - 检查是否有典型的 AI 幻觉模式（过于对称的数据、编造的 p 值、不存在的引用）
      - 确认所有数据来自实际分析，非 AI 生成
      - "按 ICMJE Recommendations 声明 AI 辅助技术的使用（不只在期刊要求时；本插件参与了起草、检索筛选、分析或作图也算）：写作辅助写进 Acknowledgements，数据收集 / 分析 / 作图写进 Methods，写明工具和用途；与 cover letter、投稿系统里的声明一致（见 submission-preparation Paragraph 4；ICMJE 当前条文和目标期刊的 AI 政策投稿前核对）"
  pass_criterion: "Phase A 通过，且 B–F 各条均 ✅"
  on_fail: "引用问题 → 作者核对/删除后重跑 Phase A；数据不一致 → 回 statistical-analysis / manuscript-writing"

gate_4:
  name: 图表质量
  inputs: ["图文件（figure-generation 产物）", "figure-legends.md（figure-generation 产物；或正文中的 legends）"]
  items:
    - 字体 Arial / Helvetica
    - 最小字号 ≥ 6pt（缩放后）
    - 分辨率 ≥ 300 DPI（线条图 ≥ 600 DPI）
    - 所有坐标轴有标签和单位
    - 图例清晰完整
    - 色盲友好配色
    - 每张图有对应的 Figure Legend
    - 图表编号与正文引用一一对应，无缺号、无未引用的图表
  pass_criterion: "以上各条均 ✅"
  on_fail: "回 figure-generation"

gate_5:
  name: 伦理与合规
  via: "读取 research-ethics 的产物 ethics-statement.md，与稿件 Methods / 声明段逐项核对；无该文件则先运行 research-ethics"
  items:
    - "伦理审查：批准号已写入 Methods 且与 ethics-statement.md 一致；或研究按规定免除伦理审查时，书面依据（由谁认定、依据哪一条，如《涉及人的生命科学和医学研究伦理审查办法》第三十二条，认定文件编号或日期）已写入 Methods 且与 ethics-statement.md 一致——两样都没有才 ❌"
    - "知情同意声明，或免除知情同意的说明（伦理委员会批准，写明满足的各项条件），与 ethics-statement.md 一致；免除知情同意不能代替上一条的批准号或免除审查"
    - 利益冲突声明
    - 资金来源声明
    - 数据可用性声明
    - 临床试验注册号（如适用）
    - "中国医疗卫生机构开展的研究者发起的临床研究：ethics-statement.md 记录了国家医学研究登记备案信息系统的上传 / 备案状态（如适用；期刊不要求时不必写进稿件）"
    - "数据治理：ethics-statement.md 的数据隐私与数据治理一节没有未解决的缺失项（敏感个人信息的处理依据、出境程序、外部 AI 服务的使用依据、人类遗传资源审批 / 备案，如适用）"
    - 动物研究：伦理委员会名称 + 许可/方案编号（ARRIVE 2.0 item 14）
  pass_criterion: "以上各条均 ✅（不适用的写原因）"
  on_fail: "回 research-ethics"

gate_6:
  name: 形式检查
  note: "在 Markdown 稿（manuscript/*.md）上检查。最终 .docx 由本 skill 通过后的 manuscript-export 生成，导出后的 export-report.md 会再报一次字数，两者应一致。"
  how:
    - "运行 python3 ${CLAUDE_PLUGIN_ROOT}/skills/manuscript-export/scripts/export_docx.py --manuscript-dir manuscript --journal <期刊id> --report-only --report gate6-report.md：只出报告不生成 .docx，给出正文字数（按条目 limits.body_excludes 计，如 Nature Medicine 不算 Methods）、摘要字数、参考文献数、图表数（或图表合计）与占位符；非原始研究加 --article-type；报告中 ❓（数不准）、ℹ️ not checked、✅*（条目未核实）都不算通过，需人工核对"
    - "脚本不可用时手工计数：正文字数只算 Introduction–Discussion（不含题页、摘要、参考文献、图表说明）；摘要单独计数；参考文献数 = References 条目数；图表数 = Figure/Table 编号数"
    - "目标期刊的限制从 journal-selection-report.md 读取，或用 ${CLAUDE_PLUGIN_ROOT}/skills/manuscript-writing/scripts/get_journal_template.py --id <期刊id> 取该刊条目的 limits（body_words / body_excludes / abstract_words / references / figures / tables，或图表合计的 display_items、按页限制的 pages、参考值标记 soft）；非原始研究用 limits_by_type.<类型>，没有则查期刊作者指南并记进项目 journal-overrides.yaml；条目没有 guidelines_checked 时把'上限未核实'的警告写进报告并转告用户"
  items:
    - 正文字数在目标期刊限制内
    - 摘要字数在限制内，且结构（结构式/非结构式）符合期刊要求
    - 参考文献数量在限制内
    - 图表数量在限制内
    - 目标期刊条目未核实（无 guidelines_checked）时：警告已转告用户，上限已在期刊官网确认或在报告中列为待确认
    - 目标期刊条目有"待核实"项时（get_journal_template.py 的第二行警告）：逐条转告用户并列为待确认，不当作已通过的上限
    - Running title / Short title ≤ 50 字符
    - 关键词 3-6 个
    - 所有缩写首次出现已展开
    - 作者信息完整（单位、通讯作者、ORCID）
    - 章节顺序与期刊要求一致（如 Nature 系 I-R-D-M）
  pass_criterion: "以上各条均 ✅"
  on_fail: "回 manuscript-writing 精简/补充"
