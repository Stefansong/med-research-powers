# Research Ethics — Compliance Checklist
# Loaded by research-ethics/SKILL.md Workflow Step 2.
# Six sections + Methods statement template.
# Section 1 = approval scope; Section 3 = consent (incl. retrospective waiver — listed once, here only).

sections:
  - id: 1
    name: 伦理审查 (IRB / EC)
    items:
      - 已获机构伦理委员会批准（或已提交，注明预计批准时间）
      - 批准编号已记录
      - 方案在批准范围内（研究目的、人群、样本量、数据项与批件一致）
      - "回顾性数据 / AI 训练数据的二次使用是否在原批准范围内（原批件或数据使用协议是否覆盖本研究目的；不覆盖则需新申请或修正案）"
      - "涉及人的生命科学和医学研究：按《涉及人的生命科学和医学研究伦理审查办法》(2023) 核对——审查类别（一般 / 简易程序 / 免除审查）、免除审查的适用条件（如使用匿名化信息数据、已合法公开的数据）是否成立并有书面说明"
      - "多中心研究：牵头单位伦理批件 + 各分中心认可/备案"

  - id: 2
    name: 动物实验伦理 (IACUC)
    items:
      - IACUC 批准
      - 3R 原则（Replacement, Reduction, Refinement）
      - 人道终点标准
      - 麻醉/镇痛/安乐死方案（AVMA 指南）
      - 操作人员资格证

  - id: 3
    name: 知情同意
    items:
      - "前瞻性：书面知情同意（版本号与批准日期）"
      - "回顾性：知情同意豁免及理由（数据已去标识化 / 无法联系 / 风险极小），豁免由伦理委员会书面批准"
      - "特殊群体：未成年人（监护人同意 + 本人知情）/ 无法自主同意者（法定代理人）"
      - 同意书含退出权利、数据用途（含是否用于 AI 模型训练、二次使用）
      - "广泛同意（broad consent）用于生物样本库 / 数据库时，说明范围与再联系机制"

  - id: 4
    name: 数据隐私与数据治理
    items:
      - 去标识化完成（方式：删除直接标识符 / 假名化 / 匿名化；影像去除 DICOM 头与面部）
      - 符合法规（中国：个人信息保护法 / EU：GDPR / US：HIPAA）
      - "中国人类遗传资源：涉及采集、保藏中国人体组织/细胞/血液等生物样本或基因数据 → 按《人类遗传资源管理条例》（国务院令第 777 号修订版）核对：采集/保藏是否需国家卫生健康委员会审批或备案（科技部 2024 年 4 月 25 日公告：自 2024 年 5 月 1 日起人类遗传资源管理工作由科技部调整为国家卫生健康委员会负责，原有申请流程及平台不变）；国际合作研究（含外方单位参与、数据共享）是否已办理审批或备案；样本或遗传资源数据出境（含向境外服务器/AI 平台传输）是否已获批准并完成信息备案"
      - 数据存储安全（加密、访问控制、访问日志）
      - 跨境传输限制评估（含云服务与第三方 API 所在地）
      - "AI 平台使用限制：禁止上传含患者可识别信息的原始数据；使用外部模型 API 前确认数据已去标识化且不违反 §4 出境要求"
      - "公开数据集：确认原始数据集的伦理批准与使用许可（license）覆盖本研究用途"

  - id: 5
    name: 研究注册
    items:
      - "临床试验：已注册（ClinicalTrials.gov / ChiCTR），在首例入组前"
      - "系统综述：已注册（PROSPERO），在数据提取前"
      - "诊断准确性 / 预测模型研究：建议预注册（ClinicalTrials.gov / ChiCTR / OSF）"

  - id: 6
    name: 利益冲突与数据共享
    items:
      - 资金来源声明
      - 利益冲突声明（含与 AI 供应商 / 器械厂商的关系）
      - 数据共享计划（期刊日益要求；说明可共享范围与限制理由）
      - 代码 / 模型权重共享计划（AI 研究）

# Methods 伦理声明模板（写入 ethics-statement.md，manuscript-writing 会引用）
methods_statement_template: |
  本研究经[机构名称]伦理委员会批准（批准号：xxx），
  符合赫尔辛基宣言原则。[所有参与者签署了书面知情同意书 /
  经伦理委员会批准，本回顾性研究免除知情同意要求]。
  [如适用：本研究涉及中国人类遗传资源的采集/国际合作/出境，已按《人类遗传资源管理条例》完成审批/备案（编号：xxx）。]
  [如适用：本研究已在 ClinicalTrials.gov / ChiCTR / PROSPERO 注册（注册号：xxx）。]
