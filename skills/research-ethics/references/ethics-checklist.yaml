# Research Ethics — Compliance Checklist
# Loaded by research-ethics/SKILL.md Workflow Step 2.
# Six sections + Methods statement template.
# Section 1 = approval scope and exemption from review; Section 3 = consent (incl. retrospective waiver —
# listed once, here only); Section 4 = China data rules (PIPL, cross-border transfer, human genetic resources,
# external AI services).
# Sources: the article numbers and conditions below were checked (2026-10) against excerpts of the official texts
# returned by web search — the official pages themselves (npc.gov.cn / cac.gov.cn / nhc.gov.cn) could not be opened
# from the tool environment. Anything marked 待核实 could not be confirmed; check the current official text (and,
# for a concrete project, the institution's data-compliance / legal office) before relying on it. This checklist is
# not legal advice.

sections:
  - id: 1
    name: 伦理审查 (IRB / EC)
    items:
      - "已获机构伦理委员会批准（或已提交，注明预计批准时间）；或按规定免除审查且有书面依据（见本节以“免除审查”开头的两条）"
      - "批准编号已记录（免除审查时记录认定文件的编号或日期）"
      - 方案在批准范围内（研究目的、人群、样本量、数据项与批件一致）
      - "回顾性数据 / AI 训练数据的二次使用是否在原批准范围内（原批件或数据使用协议是否覆盖本研究目的；不覆盖则需新申请或修正案）"
      - "涉及人的生命科学和医学研究：按《涉及人的生命科学和医学研究伦理审查办法》（国卫科教发〔2023〕4号，2023-02-18 起施行）核对审查类别（一般 / 简易程序 / 免除审查）"
      - "免除审查（《办法》第三十二条）有前提：只适用于使用人的信息数据或生物样本、不对人体造成伤害、不涉及敏感个人信息或者商业利益的研究；在此前提下的情形如利用合法获得的公开数据（或观察且不干扰公共行为产生的数据）、使用匿名化的信息数据、使用来源合规且研究内容和目的在规范的知情同意范围内的已有生物样本（完整情形以第三十二条原文为准）。去标识化（不是匿名化）的病历数据仍是敏感个人信息（见 §4），不能据此免除审查"
      - "免除审查要有书面依据：适用第三十二条的哪一种情形、由谁认定；所在机构规定由伦理委员会认定的，附认定文件。研究者不要自行认定后直接写进论文"
      - "多中心研究：牵头单位伦理批件 + 各分中心认可/备案"

  - id: 2
    name: 动物实验伦理 (IACUC)
    items:
      - IACUC 批准
      - 3R 原则（Replacement, Reduction, Refinement）
      - 人道终点标准
      - 麻醉/镇痛/安乐死方案（AVMA 指南）
      - 操作人员资格证

  - id: 3
    name: 知情同意
    items:
      - "前瞻性：书面知情同意（版本号与批准日期）"
      - "回顾性 / 二次使用的免除知情同意：由伦理委员会书面批准，并逐条写明满足的条件——各项条件须同时满足，不是任选其一。例如 CIOMS 2016 国际伦理指南第 10 条：不豁免就无法或难以开展、研究具有重要社会价值、对参与者的风险不超过最小风险（三项同时满足）；美国 Common Rule 45 CFR 46.116(f)(3) 还要求豁免不损害参与者的权利和福利等。中国研究按所在机构伦理委员会的 SOP 写明依据（2023《办法》中关于免除知情同意的具体条文待核实）"
      - "“数据已去标识化”是隐私保护措施，本身不是免除知情同意的理由；“联系不上患者”只回答了“不豁免能否开展”这一项。免除知情同意也不自动等于个人信息保护法下处理个人信息的合法性基础（见 §4）"
      - "特殊群体：未成年人（监护人同意 + 本人知情；不满十四周岁者的个人信息另见 §4）/ 无法自主同意者（法定代理人）"
      - "同意书含退出权利和数据用途：逐项写明是否用于 AI 模型训练、二次使用、是否提供给其他单位、是否向境外提供。以同意为依据处理医疗健康信息（含 AI 模型训练、二次使用）须取得个人的单独同意（个人信息保护法 第二十九条）；提供给其他单位（第二十三条）、向境外提供（第三十九条）另须告知接收方信息并分别取得单独同意，见 §4。单独同意怎样取得（如单独签署或勾选、不与其他事项捆绑）按本机构伦理委员会 / 法务部门的要求（具体形式待核实）"
      - "广泛同意（broad consent）用于生物样本库 / 数据库时，说明范围与再联系机制"

  - id: 4
    name: 数据隐私与数据治理
    items:
      - "去标识化和匿名化分开写，不能混用：去标识化（删除直接标识符、假名化 / 编码，影像去除 DICOM 头与面部）指不借助额外信息就无法识别特定自然人，处理后仍是个人信息；匿名化指无法识别特定自然人且不能复原，处理后才不属于个人信息（个人信息保护法 第四条、第七十三条）。写明用的是哪一种、由谁做、编码与身份的对照表存放在哪里、谁能访问"
      - "符合适用法规（中国：个人信息保护法，2021-11-01 起施行 / EU：GDPR / US：HIPAA）；中国按下面各条逐项核对"
      - "医疗健康信息是敏感个人信息（个人信息保护法 第二十八条；不满十四周岁未成年人的个人信息也是）：只有在具有特定的目的和充分的必要性、并采取严格保护措施的情形下才能处理；收集和使用的数据项限于研究目的所必需"
      - "合法性基础（第十三条）：依靠个人同意时，处理敏感个人信息须取得个人的单独同意（第二十九条；法律、行政法规要求书面同意的从其规定）；不满十四周岁者须取得父母或其他监护人的同意并制定专门的处理规则（第三十一条，条文待核实）。第十三条没有把“科学研究”单列为合法性基础：回顾性数据无法重新取得同意时，由本机构数据合规 / 法务部门和伦理委员会确认依据并写进 ethics-statement.md（个案判断，待核实）"
      - "提供给其他单位或委托处理（合作单位、外包公司、云服务、外部 AI 服务）：委托处理须与受托方约定处理目的、期限、处理方式、个人信息的种类、保护措施及双方权利义务，并监督受托方（第二十一条）；向另一个个人信息处理者提供须告知接收方名称、联系方式、处理目的、处理方式和信息种类，并取得个人的单独同意（第二十三条）"
      - "个人信息保护影响评估（第五十五条）：处理敏感个人信息、委托处理 / 向他人提供 / 公开个人信息、向境外提供个人信息之前，须事前评估并记录；评估报告和处理情况记录至少保存三年（第五十六条）"
      - "数据出境（包括服务器在境外的云服务和 AI API；个人信息保护法 第三十八条、第三十九条）：须具备一种法定条件——通过国家网信部门组织的数据出境安全评估 / 与境外接收方订立个人信息出境标准合同（《个人信息出境标准合同办法》，合同生效后 10 个工作日内向省级网信部门备案）/ 通过个人信息保护认证（《个人信息出境认证办法》，2026-01-01 起施行）；并向个人告知境外接收方信息、取得单独同意（第三十九条）"
      - "出境门槛按《促进和规范数据跨境流动规定》（国家网信办，2024-03-22 起施行）：国际贸易、学术合作等活动中不含个人信息和重要数据的数据（如真正匿名化的数据）免予上述程序（第三条）；非关键信息基础设施运营者自当年 1 月 1 日起累计向境外提供不满 10 万人的个人信息（不含敏感个人信息）可免予（第五条；该条另有履行合同、跨境人力资源管理、紧急情况下保护生命健康等情形，一般研究用不上）。敏感个人信息没有数量豁免：不满 1 万人须订立标准合同或通过认证，1 万人以上（或非敏感个人信息 100 万人以上、或含重要数据、或关键信息基础设施运营者）须申报数据出境安全评估。某个医疗数据集是否属于重要数据，按主管部门公布的重要数据目录或认定判断（待核实）"
      - "中国人类遗传资源：涉及采集、保藏中国人体组织/细胞/血液等生物样本或基因数据 → 按《人类遗传资源管理条例》（国务院令第 777 号修订版）及《人类遗传资源管理条例实施细则》（科技部令第 21 号，2023-07-01 起施行）核对：采集/保藏是否需国家卫生健康委员会审批或备案（科技部 2024 年 4 月 25 日公告：自 2024 年 5 月 1 日起人类遗传资源管理工作由科技部调整为国家卫生健康委员会负责，原有申请流程及平台不变）；国际合作研究（含外方单位参与、数据共享）是否已办理审批或备案；生物样本（人类遗传资源材料）出境是否已获批准"
      - "人类遗传资源信息（利用人类遗传资源材料产生的基因、基因组数据等；不包括临床数据、影像数据、蛋白质数据和代谢数据——实施细则第二条）向外国组织、个人及其设立或实际控制的机构提供或开放使用（包括上传到境外 AI 平台）前，须提交信息备份并取得备案号后才能提供（条例中对应条文号待核实）；基因数据同时按上面的个人信息规则处理"
      - 数据存储安全（加密、访问控制、访问日志）
      - "外部 AI 服务（云端大模型 API、在线 AI 平台，也包括运行本插件的 AI 会话本身——让 AI 读取患者级数据文件就是把数据发给外部服务）：默认只发送匿名化数据或汇总结果（如 data_profile.py 的汇总、统计表），不发送患者级数据。去标识化 / 假名化的患者级数据仍是敏感个人信息，只有同时满足以下全部条件才可发送：(1) 有合法性基础（单独同意或经确认的其他依据）；(2) 与服务方签订委托处理协议，约定目的和期限（如不得用于模型训练、处理完删除）；(3) 已做个人信息保护影响评估；(4) 服务器在境外时已完成上面的出境程序；(5) 数据持有方（医院 / 数据提供单位）书面许可，且伦理委员会批准的方案写明了这一用途。任一条不满足 → 不发送，改在本地运行分析"
      - "公开数据集：确认原始数据集的伦理批准与使用许可（license）覆盖本研究用途"

  - id: 5
    name: 研究注册
    items:
      - "临床试验：已注册（ClinicalTrials.gov / ChiCTR），在首例入组前"
      - "中国医疗卫生机构开展的研究者发起的临床研究（IIT）：按《医疗卫生机构开展研究者发起的临床研究管理办法》（国卫科教发〔2024〕32号，2024-10-01 起施行）第二十六条，立项审核通过时在国家医学研究登记备案信息系统（www.medicalresearch.org.cn）完成信息上传；这是向卫生健康主管部门的登记备案，不替代 ClinicalTrials.gov / ChiCTR 的公开注册。观察性研究是否也须上传，以办法第二条的定义和本机构科研管理部门的要求为准（待核实）"
      - "系统综述：已注册（PROSPERO），在数据提取前"
      - "范围综述：protocol 已在 OSF Registries 等注册或公开发表（PROSPERO 不接受范围综述，以其当前 eligibility 页面为准）"
      - "诊断准确性 / 预测模型研究：建议预注册（ClinicalTrials.gov / ChiCTR / OSF）"

  - id: 6
    name: 利益冲突与数据共享
    items:
      - 资金来源声明
      - 利益冲突声明（含与 AI 供应商 / 器械厂商的关系）
      - 数据共享计划（期刊日益要求；说明可共享范围与限制理由）
      - 代码 / 模型权重共享计划（AI 研究）

# Methods 伦理声明模板（写入 ethics-statement.md，manuscript-writing 会引用）
methods_statement_template: |
  [本研究经[机构名称]伦理委员会批准（批准号：xxx） /
  经[机构名称]伦理委员会认定，本研究依据[条款，如《涉及人的生命科学和医学研究伦理审查办法》第三十二条第x项]免除伦理审查（认定文件编号或日期：xxx）]，
  符合赫尔辛基宣言原则。[所有参与者签署了书面知情同意书 /
  经伦理委员会批准，本回顾性研究免除知情同意要求（依据：xxx）]。
  [如适用：本研究涉及中国人类遗传资源的采集/国际合作/出境，已按《人类遗传资源管理条例》完成审批/备案（编号：xxx）。]
  [如适用：本研究已在 ClinicalTrials.gov / ChiCTR / PROSPERO 注册（注册号：xxx）。]
