# Peer Review Simulation — Scoring Rubric
# Loaded by peer-review-simulation/SKILL.md Steps 2, 3, 3b, 4.

# --- Step 2: 8-dimension 0-100 scoring (weighted) ---
dimensions:
  - name: Originality 创新性
    weight: 0.15
    bands: "0-30: 重复已知 / 31-60: 增量贡献 / 61-80: 有意义创新 / 81-100: 领域突破"
  - name: Methodology 方法学
    weight: 0.20
    bands: "0-30: 严重缺陷 / 31-60: 可改进 / 61-80: 规范 / 81-100: 方法学创新"
  - name: Results 结果可靠性
    weight: 0.15
    bands: "0-30: 不可信 / 31-60: 部分可信 / 61-80: 可靠 / 81-100: 强有力"
  - name: Clinical Impact 临床意义
    weight: 0.15
    bands: "0-30: 无意义 / 31-60: 有限 / 61-80: 有意义 / 81-100: 改变实践"
  - name: Writing Quality 写作质量
    weight: 0.10
    bands: "0-30: 难以理解 / 31-60: 需要润色 / 61-80: 清晰 / 81-100: 优美精确"
  - name: Figures & Tables 图表
    weight: 0.10
    bands: "0-30: 不达标 / 31-60: 基本可用 / 61-80: 专业 / 81-100: 出版级"
  - name: References 参考文献
    weight: 0.05
    bands: "0-30: 不足/过时 / 31-60: 基本覆盖 / 61-80: 全面 / 81-100: 权威"
  - name: Reproducibility 可复现性
    weight: 0.10
    bands: "0-30: 不可复现 / 31-60: 部分可复现 / 61-80: 可复现 / 81-100: 完全透明"

# 综合分 = 加权平均（权重之和 = 1.00）

# --- Step 2 / Step 3: score → decision mapping（唯一权威表；SKILL.md、报告模板、README 都引用这里）---
score_to_decision:
  - range: "80-100"
    decision: "Accept / Minor Revision"
  - range: "65-79"
    decision: "Minor Revision"
  - range: "50-64"
    decision: "Major Revision"
  - range: "30-49"
    decision: "Major Revision (risky)"
  - range: "0-29"
    decision: "Reject"
# 每位 Reviewer 也按此表给出自己的 Recommendation（Accept / Minor / Major / Reject）；
# Editor 的最终决策不是平均分：≥1 个 Critical → 至少 Major；≥2 位 Reviewer 建议 Reject → Reject。

# --- Step 3b: journal calibration tiers（按期刊在学科内的位置，不用绝对 IF）---
# 怎么判断档位：看 journal-selection-report.md 里的梯队、JCR/中科院分区和该刊在本专科的排名；
# 引用 IF 时必须标年份（journal-templates.yaml 的 IF_approx 是 JCR 2022 值）并建议 WebSearch 复核。
journal_calibration:
  - tier: "综合顶刊"
    examples: "NEJM、Lancet、JAMA、BMJ、Nature Medicine"
    adjustment: "-10 到 -15"
    note: "标准极高，要求改变实践级别的证据；同样论文得分下调 10-15 分"
  - tier: "专科 Top"
    examples: "本专科排名前 10% 的期刊（如泌尿科的 European Urology、影像科的 Radiology）"
    adjustment: "-5 到 -10"
    note: "标准高，得分下调 5-10 分"
  - tier: "主流"
    examples: "本专科中上游、多数 SCI 收录的专科期刊（如 BJU International、World J Urol、Urology）"
    adjustment: "0"
    note: "标准适中，得分不调整"
  - tier: "入门"
    examples: "学科分区靠后、新创刊、区域性期刊"
    adjustment: "+5"
    note: "标准较宽松，得分上调 5 分"
# 若用户指定 Target Journal，在评分矩阵后添加 Raw Score / Calibrated Score / Calibration note（写档位，不写 IF 数值）。

# --- Step 4: issue severity grading ---
severity_grading:
  - level: Critical
    meaning: "致命缺陷，直接拒稿"
    action: "必须修复"
  - level: Major
    meaning: "审稿人会要求修改"
    action: "强烈建议修复"
  - level: Minor
    meaning: "不影响接收但需完善"
    action: "建议修复"
  - level: Suggestion
    meaning: "改进建议"
    action: "可选"
