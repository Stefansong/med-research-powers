name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (the tag is in the comment); Dependabot
# (.github/dependabot.yml) proposes updates. Tool versions installed here are pinned too.

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt ruff==0.16.9

      - name: Repository consistency guard
        run: python tools/check_consistency.py

      - name: Validate JSON manifests
        run: |
          python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Validate YAML references
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in glob.glob("skills/**/*.yaml", recursive=True) + glob.glob("skills/**/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("❌ invalid YAML:")
              print("\n".join(bad)); sys.exit(1)
          print("✅ all skill YAML files parse")
          PY

      - name: Lint Python (ruff — pyflakes F and syntax errors E9)
        run: ruff check --no-cache --select F,E9 --output-format github skills tools tests

      - name: Syntax-check Python scripts
        run: python -m compileall -q skills tools

      - name: Shell syntax (sh -n)
        run: sh -n hooks/session-start.sh install.sh

      - name: shellcheck
        # Blocking. shellcheck is preinstalled on the ubuntu runner image; apt is only a fallback.
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version
          shellcheck hooks/session-start.sh install.sh

      - name: Hook smoke test (empty project directory)
        # The SessionStart hook must print plain-text context (not a JSON object) even
        # when there is no .mrp-state.json, and it must not crash.
        run: |
          set -eu
          tmp="$(mktemp -d)"
          chmod +x hooks/session-start.sh
          out="$(cd "$tmp" && CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" CLAUDE_PROJECT_DIR="$tmp" sh "$GITHUB_WORKSPACE/hooks/session-start.sh")"
          printf '%s\n' "$out" | head -40
          [ -n "$out" ] || { echo "::error::hook printed nothing"; exit 1; }
          case "$out" in
            "{"*) echo "::error::hook output starts with '{' — SessionStart hooks must print plain text"; exit 1 ;;
          esac
          echo "✅ hook smoke test passed"

      - name: Hook smoke test (crafted .mrp-state.json)
        # Guard for SECURITY.md's contract: only whitelisted fields of .mrp-state.json
        # may reach the context, values are never executed. Blocking — the hook reads the
        # state file whatever its indentation, and tests/test_session_start_hook.py covers
        # the same contract across formats, shells (dash, bash) and crafted inputs.
        run: |
          set -eu
          tmp="$(mktemp -d)"
          cat > "$tmp/.mrp-state.json" <<'JSON'
          {"project": "CI_PROJECT_MARKER", "current_stage": "study-design", "next_step": "research-ethics",
           "not_a_field": "CI_SECRET_MARKER", "artifacts": {"x.md": {"note": "CI_SECRET_MARKER"}}}
          JSON
          out="$(cd "$tmp" && CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" CLAUDE_PROJECT_DIR="$tmp" sh "$GITHUB_WORKSPACE/hooks/session-start.sh")"
          printf '%s\n' "$out" | grep -q "CI_PROJECT_MARKER" || { echo "::error::hook did not report the project name from .mrp-state.json"; exit 1; }
          if printf '%s\n' "$out" | grep -q "CI_SECRET_MARKER"; then
            echo "::error::hook leaked a non-whitelisted field of .mrp-state.json into the context"; exit 1
          fi
          echo "✅ hook only exposes whitelisted state fields"

  tests:
    # Python 3.10 is the documented minimum (CONTRIBUTING.md); 3.12 is a current release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies (latest releases allowed by requirements.txt)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pytest==9.1.1
          python -m pip list
      - name: Unit tests for bundled scripts, the hook and the guard
        # The hook tests run under dash (the runner's /bin/sh) and bash.
        run: python -m pytest tests -q

  tests-minimum-versions:
    # The lower bounds in requirements.txt are installed exactly, on the oldest supported
    # Python, so a bound that is too low fails here instead of on a user's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
      - name: Install the minimum versions from requirements.txt
        run: |
          set -eu
          # name>=X[,<Y][; marker]  →  name==X[; marker]  (comments dropped, environment markers kept)
          sed -n -e 's/[[:space:]]*#.*$//' \
                 -e 's/^\([A-Za-z0-9_.-]*\)>=\([0-9.]*\)[^;]*\(;.*\)\{0,1\}$/\1==\2\3/p' \
                 requirements.txt > "$RUNNER_TEMP/minimum.txt"
          cat "$RUNNER_TEMP/minimum.txt"
          [ "$(wc -l < "$RUNNER_TEMP/minimum.txt")" -eq "$(grep -c '^[A-Za-z]' requirements.txt)" ] \
            || { echo "::error::every requirement needs a >= lower bound"; exit 1; }
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r "$RUNNER_TEMP/minimum.txt" pytest==9.1.1
          python -m pip list
      - name: Unit tests at the minimum versions
        run: python -m pytest tests -q

  plugin-validate:
    # Blocking: the manifests must pass the validator of the pinned Claude Code release.
    # When a newer release is adopted, bump the version here and in evals.yml together.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code (pinned)
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.308
      - name: claude plugin validate --strict (plugin.json)
        run: claude plugin validate .claude-plugin/plugin.json --strict
      - name: claude plugin validate --strict (marketplace.json)
        run: claude plugin validate .claude-plugin/marketplace.json --strict
