name: Plugin evals (manual)

# Routing regression with `claude plugin eval` — costs API usage, so it runs on demand only.
# Requires the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tags to run, space-separated (smoke | routing | negative | coverage | overtrigger | behavior). Empty = routing + negative"
        default: "smoke"
      runs:
        description: "Runs per case"
        default: "2"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Sandbox tools for the behaviour case
        # data-first-planning runs data_profile.py through Bash, which the evaluator only allows
        # inside its OS sandbox (bubblewrap + socat).
        if: contains(inputs.tag, 'behavior')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
      - name: Run evals
        env:
          TAGS: ${{ inputs.tag }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -eu
          TAGS="${TAGS:-routing negative}"
          set --
          for t in $TAGS; do set -- "$@" --tag "$t"; done
          case " $TAGS " in
            *" behavior "*) set -- "$@" --scaffold --allow-tools "Bash(python3 *)" ;;
          esac
          claude plugin eval . --trust-plugin --json results.json --threshold 0.8 \
            --runs "$RUNS" --ablation none --no-publish --max-cost-usd 20 "$@"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: |
            results.json
            evals/results/
